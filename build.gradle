plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.107'
}
version = '0.1.0-beta.2'
group = 'com.townskingdoms'
base { archivesName = 'combat-afloat' }
java { toolchain.languageVersion = JavaLanguageVersion.of(21) }
repositories { mavenCentral() }
sourceSets {
    test {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
    integration {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
neoForge {
    version = '21.1.262'
    runs {
        server { server(); programArgument '--nogui'; gameDirectory = file('run/server') }
        client {
            client()
            gameDirectory = file('run/client')
            if (providers.gradleProperty('captureCombat').isPresent()) {
                systemProperty 'combatafloat.capture', 'true'
                programArgument '--quickPlaySingleplayer'
                programArgument 'CombatAfloatTest'
                programArgument '--username'
                programArgument 'CombatAfloatTest'
                programArgument '--width'
                programArgument '1280'
                programArgument '--height'
                programArgument '720'
            }
        }
        probe {
            server()
            gameDirectory = file('run/probe')
            programArgument '--nogui'
            programArgument '--world'
            programArgument "probe-${System.currentTimeMillis()}"
            systemProperty 'combatafloat.integration', 'true'
        }
    }
    mods {
        combatafloat { sourceSet sourceSets.main }
        combatafloat_tests { sourceSet sourceSets.integration }
    }
}
dependencies {
    if (providers.gradleProperty('withAeronautics').isPresent()) {
        runtimeOnly files('test-libs/create-1.21.1-6.0.10.jar', 'test-libs/aeronautics-1.3.2.jar')
    }
    if (providers.gradleProperty('withSodium').isPresent()) {
        runtimeOnly files('test-libs/sodium-neoforge-0.8.13+mc1.21.1.jar')
    }
    implementation files('libs/epic-fight-21.17.3.1-mc1.21.1-neoforge.jar')
    implementation files('libs/sable-neoforge-1.21.1-2.0.5.jar')
    compileOnly files('libs/sable-companion-common-1.21.1-1.6.0.jar')
    compileOnly files('libs/veil-neoforge-1.21.1-4.3.2.jar')
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.ow2.asm:asm-tree:9.7.1'
    testImplementation files('libs/sable-companion-common-1.21.1-1.6.0.jar')
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('test', Test) { useJUnitPlatform() }
tasks.named('jar', Jar) {
    archiveFileName = "combat-afloat-${project.version}-neoforge-1.21.1.jar"
    from('LICENSE')
    manifest.attributes('Implementation-Version': project.version)
}
